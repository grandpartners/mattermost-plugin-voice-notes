name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: ./package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-tarball
          path: dist/*.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/*.tar.gz voicenotes.tar.gz
          gh release create '${{ github.ref_name }}' dist/*.tar.gz voicenotes.tar.gz --generate-notes
